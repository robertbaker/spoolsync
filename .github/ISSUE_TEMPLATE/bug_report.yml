name: Bug report
description: Something in the SpoolSync web app or CLI isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: interface
    attributes:
      label: Where did it happen?
      options:
        - Web app
        - CLI
        - Both / not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Web app only.
      placeholder: Firefox 130
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: CLI version and Node.js version
      description: CLI only.
      placeholder: spoolsync 0.3.0, Node 22.4
  - type: input
    id: services
    attributes:
      label: Services involved
      description: Source and target tools, and whether you used a file or an API connection.
      placeholder: "Spoolman (API) → Bambu Studio (file)"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Console output or CLI output. Remove API keys, passwords, and tokens first.
      render: shell
  - type: textarea
    id: files
    attributes:
      label: Sample data
      description: Attach a sanitized export that reproduces the problem if you can (drag files into this box). Remove personal info and credentials.
