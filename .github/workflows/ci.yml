name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      e2e: ${{ steps.filter.outputs.e2e }}
      e2e_specs: ${{ steps.filter.outputs.e2e_specs }}
      e2e_specs_files: ${{ steps.filter.outputs.e2e_specs_files }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'tests/**'
              - 'e2e/**'
              - 'tools/**'
              - 'packages/**'
              - 'astro.config.mjs'
              - 'wrangler.jsonc'
              - 'tsconfig.json'
              - 'oxlint.json'
              - '.oxlintignore'
              - 'bunfig.toml'
              - 'playwright.config.ts'
              - 'starwind.config.json'
              - 'package.json'
              - 'bun.lock'
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # Anything that can change browser behavior: runs the whole suite.
            e2e:
              - 'src/**'
              - 'public/**'
              - 'packages/spoolsync-core/**'
              - 'astro.config.mjs'
              - 'wrangler.jsonc'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'starwind.config.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # Changed spec files only: runs just those specs when nothing above changed.
            e2e_specs:
              - 'e2e/**/*.spec.ts'
            cli:
              - 'packages/spoolsync-cli/**'
              - 'packages/spoolsync-core/**'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

  # Independent checks run as parallel jobs; the `ci` job below is the single required status.
  static:
    name: Lint, package types, docs
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run check:packages
      - run: bun run docs:services:check
      - if: failure()
        uses: ./.github/actions/cancel-run

  typecheck:
    name: Astro type check
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run check
      - if: failure()
        uses: ./.github/actions/cancel-run

  unit:
    name: Unit tests
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      # The completion tests run the real bash, zsh, and fish; REQUIRE_COMPLETION_SHELLS makes a
      # missing shell fail here instead of being skipped.
      - name: Install shells for completion tests
        run: sudo apt-get install -y --no-install-recommends zsh fish
      - uses: ./.github/actions/setup
      - run: bun run test
        env:
          REQUIRE_COMPLETION_SHELLS: "1"
      - if: failure()
        uses: ./.github/actions/cancel-run

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.e2e_specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Runs even on a cache hit: the cache holds browsers only, not the apt system deps. The
      # config runs headless, so only the headless shell is needed.
      - run: bunx playwright install --with-deps --only-shell chromium
        timeout-minutes: 3
      - run: bun run build
        timeout-minutes: 3
      - run: bun run bundle:check
      # Full suite when app code changed; otherwise only the spec files that changed.
      - name: Run E2E tests
        timeout-minutes: 6
        env:
          FULL_SUITE: ${{ needs.changes.outputs.e2e }}
          CHANGED_SPECS: ${{ needs.changes.outputs.e2e_specs_files }}
        run: |
          if [ "$FULL_SUITE" = "true" ]; then
            bun run test:e2e
          else
            specs=""
            for f in $CHANGED_SPECS; do [ -f "$f" ] && specs="$specs $f"; done # skip deleted specs
            if [ -z "$specs" ]; then echo "No changed specs left to run."; exit 0; fi
            echo "Running changed specs:$specs"
            bun run test:e2e $specs
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/cancel-run

  cli:
    name: CLI tests (Node ${{ matrix.label }})
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: LTS
            node: lts/*
          - label: Current
            node: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/setup
      # Builds the CLI, then runs its integration tests against the built dist/cli.js.
      - run: bun run test:cli
      - name: Smoke test built CLI
        working-directory: packages/spoolsync-cli
        run: |
          node dist/cli.js --help
          node dist/cli.js --version --json
      - name: Check package contents
        working-directory: packages/spoolsync-cli
        run: npm pack --dry-run
      - if: failure()
        uses: ./.github/actions/cancel-run

  # One stable status for branch protection: skipped jobs pass, failed or cancelled ones fail.
  ci:
    name: CI
    needs: [changes, static, typecheck, unit, e2e, cli]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1
          exit 0
