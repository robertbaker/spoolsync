[mcp_servers.astro]
url = "https://mcp.docs.astro.build/mcp"

[mcp_servers.chrome-devtools]
command = "bunx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.playwright]
command = "bunx"
args = ["@playwright/mcp", "--browser", "chrome", "--headless", "--isolated"]

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.tailwindcss-server]
command = "bunx"
args = ["tailwindcss-mcp"]

[mcp_servers.starwind-ui]
command = "bunx"
args = ["--bun", "@starwind-ui/mcp@latest"]
